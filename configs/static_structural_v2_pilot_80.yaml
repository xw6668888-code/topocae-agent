dataset:
  num_samples: 80
  random_seed: 20260603
  stock_size_range:
    L: [100.0, 150.0]
    W: [100.0, 150.0]
    H: [40.0, 60.0]
  output_dir: null

generation:
  enabled_generators:
    - SteppedHoleGenerator
    - ThroughHoleGenerator
    - BlindHoleGenerator
    - CounterboreHoleGenerator
    - CountersinkHoleGenerator
    - ObroundHoleGenerator
    - USlotGenerator
    - SlotRectGenerator
    - RectPocketGenerator
    - CircularPocketGenerator
    - BossFeatureGenerator
    - PadGenerator
    - RibGenerator
    - WebGenerator
    - FilletGenerator
    - ChamferGenerator
  instance_count_range: [0, 2]
  require_nonempty_sample: true
  max_generation_attempts: 12
  stock_profiles:
    enabled: true
    weights:
      block: 0.18
      plate: 0.22
      beam: 0.20
      cylinder: 0.18
      composite: 0.22
    composite_component_count_range: [2, 3]
  feature_ordering:
    enabled: true
  feature_orientation:
    hole_axes: [z, x, y]
  feature_density:
    enabled: true
    max_total_instances_per_sample: 8
    max_instances_per_generator: 1
  coverage_control:
    enabled: false
    min_instances_per_macro: 0
    target_macro_features: []
    max_extra_samples: 0
    max_attempts_per_target: 0

exports:
  write_step: true
  write_graph: true
  build_training_package: false
  split_ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  llm_round_ndigits: 4
  gnn_round_ndigits: 6

feature_catalog:
  enabled: false
  only: false
  output_subdir: feature_catalog
  variants_per_feature: 1
  max_attempts_per_feature: 80
  write_step: true
  write_graph: true
