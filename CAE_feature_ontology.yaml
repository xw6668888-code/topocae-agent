        stage: v3
        enabled: false
        recommended_for_v1: false
        notes: requires_bolt_or_fastener_semantics
      - id: 10
        key: datum_face
        stage: v2
        enabled: false
        recommended_for_v1: false
        notes: can_be_defined_but_low_learning_value_for_initial_dataset
      - id: 11
        key: measurement_face
        stage: v2
        enabled: false
        recommended_for_v1: false
        notes: postprocessing_region_not_core_feature_label

analysis_case_objects:
  description: objects_that_should_not_be_forced_into_face_labels
  recommended_for_v1: false
  objects:
    - key: reference_point
      stage: v2
      representation: point_or_axis
    - key: concentrated_force
      stage: v2
      representation: point_or_small_patch
    - key: concentrated_moment
      stage: v2
      representation: point_or_axis
    - key: remote_force
      stage: v3
      representation: point_plus_coupled_face_set
    - key: pressure_load
      stage: v2
      representation: face_set
    - key: support_constraint
      stage: v2
      representation: face_set
    - key: contact_pair
      stage: v3
      representation: paired_face_sets
    - key: coupling_constraint
      stage: v3
      representation: reference_point_plus_face_set
    - key: bolt_pretension
      stage: v3
      representation: fastener_axis_plus_face_sets
    - key: thermal_load
      stage: v3
      representation: face_set_or_body

synthetic_annotation_strategy:
  v1:
    summary: geometry_only_dataset_without_explicit_load_cases
    rules:
      - assign_primitive_surface_from_occ_surface_type
      - assign_macro_feature_during_feature_generation
      - compute_basic_idealization_tags_from_size_thresholds_and_topology
      - keep_analysis_role_as_unassigned
  v2:
    summary: add_synthetic_analysis_cases_after_geometry_generation
    rules:
      - build_candidate_face_pools_for_support_load_and_symmetry
      - sample_face_sets_with_deterministic_rules
      - store_analysis_role_labels_in_separate_head
      - store_case_objects_in_analysis_case_json_not_in_macro_feature_label
  v3:
    summary: add_assembly_contact_and_fastener_semantics
    rules:
      - generate_paired_parts_or_tooling_context
      - define_contact_pairs_and_pretension_objects

candidate_face_rules:
  support_face:
    recommended_stage: v2
    candidate_geometry:
      - large_external_planar_faces
      - mounting_pads
      - base_faces_with_low_curvature
    reject_if:
      - face_belongs_to_small_feature
      - face_is_highly_fragmented
  prescribed_displacement_face:
    recommended_stage: v2
    candidate_geometry:
      - large_external_planar_faces
      - cylindrical_end_faces
  pressure_face:
    recommended_stage: v2
    candidate_geometry:
      - pocket_bottom_faces
      - cavity_inner_faces
      - large_outer_panel_faces
    reject_if:
      - tiny_face
      - sliver_face
  symmetry_face:
    recommended_stage: v2
    prerequisite:
      - generator_must_create_part_with_known_symmetry_plane
  contact_face:
    recommended_stage: v3
    prerequisite:
      - assembly_context
  coupling_face:
    recommended_stage: v3
    prerequisite:
      - reference_point_case_object
  pretension_face:
    recommended_stage: v3
    prerequisite:
      - bolt_or_fastener_model

recommended_v1_label_subset:
  primitive_surface:
    - plane
    - cylinder
    - cone
    - sphere
    - torus
    - bspline_surface
    - other_surface
  macro_feature:
    - stock
    - through_hole_round
    - blind_hole_round
    - stepped_hole_round
    - counterbore_hole
    - countersink_hole
    - obround_hole
    - slot_u
    - slot_v
    - slot_dovetail
    - slot_o
    - slot_rect
    - pocket_rect
    - pocket_circular
    - cylinder_boss
    - rectangular_boss
    - rib
    - web
    - fillet
    - chamfer
  idealization_tag:
    - suppressible_small_hole
    - short_edge
    - small_face
    - sliver_face
    - merge_candidate_face
    - mesh_sensitive_region
  analysis_role:
    - unassigned

notes:
  - this_ontology_is_designed_to_be_realistic_for_procedural_dataset_generation
  - analysis_roles_are_kept_but_not_activated_in_v1_to_avoid_manual_annotation_cost
  - if_real_parts_are_used_later_analysis_roles_should_come_from_case_metadata_not_from_geometry_only
