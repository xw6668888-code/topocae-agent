schema_version: 1.0
ontology_name: cae_feature_ontology
owner: dataset_generator
default_units:
  length: mm
  angle: deg

scope:
  domain: single_part_structural_cae
  intended_use:
    - face_level_feature_recognition
    - feature_instance_grouping
    - selectable_face_region_extraction
    - geometry_to_static_structural_preprocessing
    - graph_learning_or_llm_finetuning
  in_scope_v1:
    - procedural_solid_generation
    - face_level_geometry_labels
    - face_level_macro_feature_labels
    - local_queryable_feature_objects
    - basic_idealization_tags
  out_of_scope_v1:
    - manual_annotation_of_real_parts_at_scale
    - assembly_contact_reasoning
    - bolt_pretension_semantics_from_real_products
    - fully_physics_meaningful_load_case_annotation
    - part_level_flange_semantics
    - hole_pattern_as_a_trained_macro_feature

design_rules:
  label_heads:
    primitive_surface:
      encoding: single_label
      primary_unit: face
    macro_feature:
      encoding: single_label
      primary_unit: face
    idealization_tag:
      encoding: multi_label
      primary_unit: face
    analysis_role:
      encoding: multi_label
      primary_unit: face
  label_generation_modes:
    geometry_direct:
      description: derived directly from B-Rep surface or topology
      feasibility: high
    feature_generator_direct:
      description: assigned during procedural feature construction
      feasibility: high
    rule_inferred:
      description: inferred from deterministic rules after geometry is built
      feasibility: medium
    synthetic_analysis_case:
      description: assigned only after generating an analysis case
      feasibility: medium
    manual_or_real_world:
      description: requires human intent or real engineering metadata
      feasibility: low
  policy:
    - do_not_mix_geometry_labels_and_analysis_case_roles_into_one_flat_class_list
    - do_not_use_concentrated_point_load_as_a_face_label
    - do_not_use_contact_or_pretension_labels_in_v1_without_assembly_or_case_generator
    - prefer_generator_direct_labels_over_posthoc_face_matching

implementation_plan:
  v1_active_layers:
    - primitive_surface
    - macro_feature
    - idealization_tag_basic
  v2_active_layers:
    - thin_wall_and_midsurface_labels
    - rule_based_analysis_role_labels_for_synthetic_cases
  v3_active_layers:
    - assembly_and_contact_case_objects
    - pretension_and_coupling_semantics

